[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranklab"
version = "0.1.0"
description = "Rank LLM answers with an AI judge and blind human preference votes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ranklab = "ranklab.cli:main"

[tool.setuptools]
packages = ["ranklab"]

[tool.setuptools.package-data]
ranklab = ["data/*.jsonl", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
